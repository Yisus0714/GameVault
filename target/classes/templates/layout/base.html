<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">GameVault</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body>

<nav>
    <a th:href="@{/juegos}" class="nav-brand">🎮 GameVault</a>
    <div class="nav-links">
        <a th:href="@{/juegos}">Catálogo</a>

        <th:block th:if="${usuarioActual != null}">
            <a th:href="@{/mis-juegos}">Mis Juegos</a>
            <a th:href="@{/juegos/nuevo}">Subir Juego</a>
            <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                <button type="submit" class="btn btn-secondary">Salir</button>
            </form>
        </th:block>

        <th:block th:if="${usuarioActual == null}">
            <a th:href="@{/login}">Iniciar sesión</a>
            <a th:href="@{/registro}">Registrarse</a>
        </th:block>

        <a th:href="@{/fragments-demo}" style="color: var(--success); margin-left:20px;">[Teoría]</a>
    </div>
</nav>

    <main class="container" th:replace="${content}">
        
    </main>

</body>
</html>
