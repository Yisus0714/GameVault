<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Formulario de juego - GameVault</title>

    <main class="container">
        <div class="panel" style="max-width: 600px; margin: 0 auto;">

            <h2 class="text-gradient" style="margin-top: 0;"
                th:text="${juego.id != null} ? 'Editar Juego' : 'Añadir Nuevo Juego'">Añadir Nuevo Juego</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">
                Completa la información del juego de tu bóveda.
            </p>

            <form th:action="${juego.id != null} ? @{/juegos/editar/{id}(id=${juego.id})} : @{/juegos}"
                  method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="titulo" class="form-label">Título del Juego</label>
                    <input type="text" id="titulo" name="titulo" th:value="${juego.titulo}" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="descripcion" class="form-label">Descripción Breve</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required class="form-control"
                              style="resize: vertical;" th:text="${juego.descripcion}"></textarea>
                </div>

                <div class="form-group">
                    <label for="precio" class="form-label">Precio</label>
                    <input type="number" step="0.01" min="0" id="precio" name="precio"
                           th:value="${juego.precio}" class="form-control">
                </div>

                <div class="form-group">
                    <label for="categoria" class="form-label">Categoria</label>
                    <select id="categoria" name="categoria" required class="form-control">
                        <option value="">Seleccione una categoria</option>
                        <option value="accion" th:selected="${juego.categoria == 'accion'}">Accion</option>
                        <option value="aventura" th:selected="${juego.categoria == 'aventura'}">Aventura</option>
                        <option value="shooter" th:selected="${juego.categoria == 'shooter'}">Shooter</option>
                        <option value="ciencia ficcion" th:selected="${juego.categoria == 'ciencia ficcion'}">Ciencia ficcion</option>
                    </select>
                </div>

                <div class="form-group" style="background-color: rgba(0,0,0,0.2); padding: 20px; border-radius: 8px; border: 1px dashed var(--primary);">
                    <label for="portada" class="form-label" style="color: var(--primary);">📸 Subir Portada (Imagen)</label>

                    <!-- Al editar, se muestra la portada actual -->
                    <img th:if="${juego.id != null and juego.portadaUrl != null}"
                         th:src="${#strings.startsWith(juego.portadaUrl, 'http')} ? ${juego.portadaUrl} : @{/uploads/{img}(img=${juego.portadaUrl})}"
                         alt="Portada actual"
                         style="width: 150px; height: 150px; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 10px;" />

                    <!-- Obligatoria solo al crear -->
                    <input type="file" id="portada" name="portada" accept="image/*"
                           th:required="${juego.id == null}" class="form-control"
                           style="border: none; background: transparent; padding-left: 0;">

                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; margin-bottom: 0;">
                        Tamaño máximo: <b>2MB</b>.
                        <span th:if="${juego.id != null}">Déjalo vacío para conservar la portada actual.</span>
                    </p>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%;">
                    Guardar en la Bóveda
                </button>
            </form>
        </div>
    </main>
</th:block>
